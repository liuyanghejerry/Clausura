name: 'Clausura Code Review'
description: 'AI-powered code review agent for CI pipelines'
author: 'liuyanghejerry'

inputs:
  version:
    description: 'Clausura version to install (e.g. "1.0.8" or "latest")'
    required: false
    default: 'latest'
  config:
    description: 'Path to .clausura.yaml config file'
    required: false
    default: '.clausura.yaml'
  base:
    description: 'Review merge-base(base, HEAD)..HEAD; defaults to the pull request base SHA'
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  artifact_name:
    description: 'Unique report artifact name (set per invocation when running multiple reviews)'
    required: false
    default: clausura-review-${{ github.job }}-${{ github.run_attempt }}
  upload_artifact:
    description: 'Upload SARIF, summary JSON and execution log even when review fails'
    required: false
    default: 'true'
  model:
    description: 'Override the LLM model'
    required: false
  vendor:
    description: 'Override the LLM vendor'
    required: false
  api_key:
    description: 'API key for the LLM provider'
    required: false
  token_budget:
    description: 'Override token budget'
    required: false
  timeout:
    description: 'Override timeout in seconds'
    required: false

outputs:
  exit_code:
    description: 'Clausura exit code: 0 pass, 1 violation, 2 runtime error/incomplete, 3 config error'
    value: ${{ steps.review.outputs.exit-code }}
  sarif:
    description: 'SARIF path (file may be absent on setup/config errors)'
    value: ${{ steps.review.outputs.report-dir }}/output.sarif
  sarif_exists:
    description: 'Whether this invocation produced a SARIF file'
    value: ${{ steps.review.outputs.sarif-exists }}
  summary:
    description: 'Run summary JSON path (file may be absent on setup/config errors)'
    value: ${{ steps.review.outputs.report-dir }}/summary.json

runs:
  using: 'composite'
  steps:
    - name: Install clausura
      shell: bash
      env:
        CLAUSURA_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Map runner OS/arch to release target triple
        case "${{ runner.os }}" in
          Linux) os_part="unknown-linux-gnu" ;;
          macOS) os_part="apple-darwin" ;;
          *)     echo "::error::Unsupported runner OS: ${{ runner.os }}"; exit 1 ;;
        esac

        case "${{ runner.arch }}" in
          X64)   arch_part="x86_64" ;;
          ARM64) arch_part="aarch64" ;;
          *)     echo "::error::Unsupported runner arch: ${{ runner.arch }}"; exit 1 ;;
        esac

        TARGET="${arch_part}-${os_part}"
        TARBALL="clausura-${TARGET}.tar.gz"

        if [ "$CLAUSURA_VERSION" = "latest" ]; then
          BASE_URL="https://github.com/liuyanghejerry/Clausura/releases/latest/download"
        else
          BASE_URL="https://github.com/liuyanghejerry/Clausura/releases/download/v${CLAUSURA_VERSION}"
        fi

        TMP_DIR="$(mktemp -d)"
        echo "Downloading ${TARBALL} from ${BASE_URL}..."
        curl -fsSL -o "$TMP_DIR/$TARBALL" "$BASE_URL/$TARBALL"
        curl -fsSL -o "$TMP_DIR/checksums.txt" "$BASE_URL/checksums.txt"

        # Verify SHA256 checksum (Linux has sha256sum, macOS has shasum)
        cd "$TMP_DIR"
        if [ "${{ runner.os }}" = "macOS" ]; then
          grep " $TARBALL\$" checksums.txt | shasum -a 256 --check
        else
          grep " $TARBALL\$" checksums.txt | sha256sum --check
        fi
        cd - >/dev/null

        BIN_DIR="$RUNNER_TEMP/clausura-bin"
        mkdir -p "$BIN_DIR"
        tar xzf "$TMP_DIR/$TARBALL" -C "$BIN_DIR"
        rm -rf "$TMP_DIR"

        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "Installed clausura $CLAUSURA_VERSION ($TARGET) to $BIN_DIR"

    - name: Verify clausura installation
      shell: bash
      run: clausura --version

    - name: Run review and record verdict
      id: review
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_VENDOR: ${{ inputs.vendor }}
        INPUT_TOKEN_BUDGET: ${{ inputs.token_budget }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-action.sh"

    - name: Upload review reports
      if: ${{ always() && inputs.upload_artifact == 'true' && steps.review.outputs.report-dir != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ steps.review.outputs.report-dir }}
        if-no-files-found: warn

    - name: Apply review verdict
      if: ${{ always() && steps.review.outputs.exit-code != '' }}
      shell: bash
      env:
        REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit-code }}
      run: exit "$REVIEW_EXIT_CODE"

branding:
  icon: 'check-circle'
  color: 'green'
