# Configuration for `cargo audit`.
#
# To ignore a specific advisory (e.g. one with no fix available yet),
# add its RUSTSEC id to the list below:
#
#   ignore = [
#       "RUSTSEC-2023-0001",
#   ]
#
# See https://rustsec.org/advisories/ for the advisory database.
[advisories]
# Unmaintained-crate notice (not a vulnerability) from serde_yaml's
# unsafe-libyaml dependency; no fixed upgrade is available. Keep in sync
# with deny.toml until the YAML dependency is replaced.
ignore = ["RUSTSEC-2024-0449"]
