version: "1"
task:
  name: secret-sweep
  model: gpt-4o
  vendor: openai
  skill_prompts:
    - secret-sweep-scan
  token_budget: 16000
  timeout_secs: 300
  max_iterations: 12
  ambiguity_policy: fail_closed
  on_incomplete: fail
  tool_allowlist:
    - git
  gating:
    - rule: hardcoded-secret
      description: Block on hardcoded secrets
      min_severity: error
      max_findings: 0
      action: fail
