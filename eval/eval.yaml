# Effect-oriented evaluation scenarios for Clausura.
#
# Run with:
#   clausura eval --config eval.yaml --model <model> [--baseline eval-results/eval-report.json]
#
# Every scenario has a fixture workspace with a seeded ground truth.
# Variants are partial YAML overrides merged over the scenario's
# .clausura.yaml — use them to compare implementation/config choices
# with numbers instead of assertions.

scenarios:
  - name: security-basics
    description: >
      A small web project with three seeded security issues (SQL injection,
      hardcoded API key, XSS). The review must report all three; the gate
      then fails, which is the *correct* outcome — recall is the metric that
      matters here, not the exit code.
    workspace: scenarios/security-basics/workspace
    config: .clausura.yaml
    ground_truth:
      - rule_id: sql-injection
        min_findings: 1
      - rule_id: hardcoded-secret
        min_findings: 1
      - rule_id: xss
        min_findings: 1
    runs: 3
    variants:
      - name: default
      - name: compact
        config_overrides:
          task:
            auto_compact: true
      - name: no-ledger
        config_overrides:
          task:
            findings_ledger: false

  - name: context-stress
    description: >
      A single large diff (~120KB) with one seeded hardcoded secret near the
      tail. A small token budget forces context truncation (and tool-output
      spill) mid-review. Measures whether findings near the end of a large
      diff survive truncation, with and without auto-compact.
    workspace: scenarios/context-stress/workspace
    config: .clausura.yaml
    ground_truth:
      - rule_id: hardcoded-secret
        min_findings: 1
    runs: 3
    variants:
      - name: default
      - name: compact
        config_overrides:
          task:
            auto_compact: true
      - name: big-budget
        config_overrides:
          task:
            token_budget: 60000

  - name: sharded-security-audit
    description: >
      A multi-file "PR" (~10KB across 6 files) with three seeded security
      findings (SQL injection, hardcoded secret, XSS) plus three large
      low-risk filler files. The default variant audits it through the
      sharded path (2 files / 2KB of diff per shard, 300k-token-equivalent
      per-shard budgets scaled down for eval); the monolithic variant
      reproduces the old failing shape — one tiny-budget agent run over the
      whole diff — and is expected to end incomplete with lost recall.
      Metric of interest: findings recall and run completeness per variant.
    workspace: scenarios/sharded-security-audit/workspace
    config: .clausura.yaml
    ground_truth:
      - rule_id: sql-injection
        min_findings: 1
      - rule_id: hardcoded-secret
        min_findings: 1
      - rule_id: xss
        min_findings: 1
    runs: 1
    variants:
      - name: sharded
      - name: monolithic
        config_overrides:
          task:
            sharding: null
            token_budget: 2000
            max_iterations: 3

  - name: rust-service
    description: >
      A multi-crate Rust service (core/store/api). Five rule categories with
      a severity ladder: panicking unwraps (4), SQL injection (2), hardcoded
      DB credentials (1), swallowed errors (1), leftover todo! markers (2).
      Exercises cross-file navigation and severity calibration.
    workspace: scenarios/rust-service/workspace
    config: .clausura.yaml
    ground_truth:
      - rule_id: panic-unwrap
        min_findings: 3
        max_findings: 4
      - rule_id: sql-injection
        min_findings: 2
      - rule_id: hardcoded-secret
        min_findings: 1
      - rule_id: swallowed-error
        min_findings: 1
      - rule_id: todo-marker
        min_findings: 2
    runs: 3
    variants:
      - name: default
      - name: compact
        config_overrides:
          task:
            auto_compact: true

  - name: web-monorepo
    description: >
      A TypeScript monorepo (shared/api/web). XSS (3), SQL injection (2),
      hardcoded secrets (2), explicit-any casts (5), console.log (4). The
      info/warning rules test severity discipline and count accuracy.
    workspace: scenarios/web-monorepo/workspace
    config: .clausura.yaml
    ground_truth:
      - rule_id: xss
        min_findings: 3
      - rule_id: sql-injection
        min_findings: 2
      - rule_id: hardcoded-secret
        min_findings: 2
      - rule_id: no-explicit-any
        min_findings: 4
      - rule_id: console-log
        min_findings: 3
    runs: 3
    variants:
      - name: default
      - name: compact
        config_overrides:
          task:
            auto_compact: true

  - name: legacy-refactor
    description: >
      A legacy Python service. Bare excepts (5), f-string SQL injection (2),
      pickle deserialization (3), one hardcoded payment API key, and eight
      debug prints as low-severity distractors. Tests precision under noise.
    workspace: scenarios/legacy-refactor/workspace
    config: .clausura.yaml
    ground_truth:
      - rule_id: bare-except
        min_findings: 4
        max_findings: 5
      - rule_id: sql-injection
        min_findings: 2
      - rule_id: unsafe-deserialization
        min_findings: 2
        max_findings: 3
      - rule_id: hardcoded-secret
        min_findings: 1
      - rule_id: debug-print
        min_findings: 4
    runs: 3
    variants:
      - name: default
      - name: compact
        config_overrides:
          task:
            auto_compact: true

  - name: secret-sweep
    description: >
      A 38-file sweep across 10 services: 12 real seeded secrets plus 8 decoy
      placeholders (REPLACE_ME / example-* / dummy-*) that must NOT be
      reported. max_findings=12 turns the decoys into a precision signal —
      over-reporting counts against the run. Generated by generate.py.
    workspace: scenarios/secret-sweep/workspace
    config: .clausura.yaml
    ground_truth:
      - rule_id: hardcoded-secret
        min_findings: 10
        max_findings: 12
    runs: 3
    variants:
      - name: default
      - name: compact
        config_overrides:
          task:
            auto_compact: true
      - name: big-budget
        config_overrides:
          task:
            token_budget: 60000
